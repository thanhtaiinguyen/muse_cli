name: CI (.NET 10 / Windows)

on:
  push:
    branches:
      - main
      - 'upgrade/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      MUSE_BROWSER_TESTS: '1'
      MUSE2API_HEADLESS: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build solution
        run: dotnet build Muse2Api.sln -c Release
      - name: Core, agent and browser regression tests
        run: dotnet test tests/Muse2Api.Tests/Muse2Api.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=core.trx" --results-directory TestResults
      - name: Windows native computer tests
        run: dotnet test tests/Muse2Api.Computer.Tests/Muse2Api.Computer.Tests.csproj -c Release --logger "trx;LogFileName=computer.trx" --results-directory TestResults
      - name: Audit direct and transitive package dependencies
        run: dotnet list Muse2Api.sln package --vulnerable --include-transitive
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ github.run_id }}
          path: TestResults/*.trx
          if-no-files-found: ignore

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan committed secrets and Git history
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
