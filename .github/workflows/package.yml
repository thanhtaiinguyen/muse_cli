name: Package Muse for Windows

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release for an existing tag on this commit'
        type: boolean
        default: false
        required: true
      release_tag:
        description: 'Existing tag name (required if publish_release is true)'
        type: string
        required: false

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      MUSE2API_HEADLESS: '1'
      MUSE_BROWSER_TESTS: '1'
    steps:
      - name: Checkout branch under test
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build and run full solution tests
        run: |
          dotnet build Muse2Api.sln -c Release
          dotnet test tests/Muse2Api.Tests/Muse2Api.Tests.csproj -c Release --no-restore
          dotnet test tests/Muse2Api.Computer.Tests/Muse2Api.Computer.Tests.csproj -c Release
      - name: Publish and verify packaged app
        shell: pwsh
        run: ./scripts/Publish-Desktop.ps1
      - name: Create ZIP and SHA256 checksum
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/Muse/*' -DestinationPath 'Muse-win-x64.zip' -CompressionLevel Optimal
          $hash = (Get-FileHash 'Muse-win-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Muse-win-x64.zip" | Set-Content -Path 'Muse-win-x64.zip.sha256' -Encoding ascii
      - name: Upload testable Windows package
        uses: actions/upload-artifact@v6
        with:
          name: muse-win-x64-${{ github.run_number }}
          path: |
            Muse-win-x64.zip
            Muse-win-x64.zip.sha256
          if-no-files-found: error

  github-release:
    if: ${{ inputs.publish_release == true }}
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require matching release tag
        env:
          TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ -z "$TAG" || ! "$TAG" =~ ^v[0-9]+\\.[0-9]+\\.[0-9]+$ ]]; then
            echo "A valid release tag like v1.0.0 is required."
            exit 1
          fi
          git_ref=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')
          commit=$(gh api "repos/$REPO/commits/$git_ref" --jq '.sha')
          if [[ "$commit" != "$SHA" ]]; then
            echo "Release tag is not attached to the checked-out commit."
            exit 1
          fi
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: muse-win-x64-${{ github.run_number }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          gh release create "$TAG" Muse-win-x64.zip Muse-win-x64.zip.sha256 --repo "${{ github.repository }}" --title "Muse $TAG" --generate-notes --verify-tag
